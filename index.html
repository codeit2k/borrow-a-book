<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEO-LIBRARY // v7.0 THE NEXUS (PERSISTENT)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Syncopate:wght@700&family=Bungee&display=swap" rel="stylesheet">
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        :root { --neon-pink: #ff007f; --neon-green: #bcff00; --neon-blue: #00f0ff; }
        body { font-family: 'Space Grotesk', sans-serif; background-color: var(--neon-green); color: #000; overflow-x: hidden; }
        .bungee { font-family: 'Bungee', cursive; }
        .neo-border { border: 4px solid black; box-shadow: 10px 10px 0px 0px #000; transition: 0.2s; }
        .neo-border:hover { transform: translate(-2px, -2px); box-shadow: 14px 14px 0px 0px #000; }
        .neo-btn { border: 3px solid black; box-shadow: 4px 4px 0px 0px #000; cursor: pointer; transition: 0.1s; font-weight: 800; text-transform: uppercase; }
        .neo-btn:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px 0px #000; }
        .tab-active { background-color: var(--neon-pink) !important; color: white !important; transform: translateY(-5px); }
        .xp-bar { height: 20px; border: 3px solid black; background: #fff; position: relative; overflow: hidden; }
        .xp-progress { height: 100%; background: var(--neon-blue); transition: width 0.5s ease; }
        .glitch-text:hover { animation: glitch 0.3s infinite; }
        @keyframes glitch {
            0% { text-shadow: 2px 0 var(--neon-pink), -2px 0 var(--neon-blue); }
            50% { text-shadow: -2px 0 var(--neon-pink), 2px 0 var(--neon-blue); }
            100% { text-shadow: 2px 0 var(--neon-pink), -2px 0 var(--neon-blue); }
        }
    </style>
</head>
<body x-data="app()" x-init="init()">

    <!-- LOGIN OVERLAY -->
    <div x-show="!isLoggedIn" class="fixed inset-0 z-[100] flex items-center justify-center bg-black p-4">
        <div class="bg-white neo-border p-8 max-w-md w-full text-center">
            <h1 class="text-6xl font-black italic mb-2 bungee">THE NEXUS</h1>
            <p class="text-xs font-bold uppercase mb-6 text-pink-600">Syncing Reading Consciousness...</p>
            <input type="text" x-model="username" placeholder="PLAYER_ID" class="w-full border-4 border-black p-4 mb-4 text-center font-bold text-2xl outline-none">
            <div class="grid grid-cols-4 gap-3 mb-8">
                <template x-for="av in avatars">
                    <button @click="selectedAvatar = av.img; playerClass = av.name" :class="selectedAvatar === av.img ? 'bg-pink-500 scale-110 text-white' : 'bg-gray-100'" class="text-3xl p-3 border-4 border-black">
                        <span x-text="av.img"></span>
                    </button>
                </template>
            </div>
            <button @click="login()" class="w-full bg-[#bcff00] p-6 text-3xl font-black border-4 border-black neo-btn bungee">INITIALIZE</button>
        </div>
    </div>

    <!-- MAIN INTERFACE -->
    <div x-show="isLoggedIn" class="p-4 md:p-6 max-w-[1700px] mx-auto">
        <!-- TOP HUD -->
        <header class="grid grid-cols-1 lg:grid-cols-12 gap-4 mb-8">
            <div class="lg:col-span-3 bg-white neo-border p-4 flex items-center gap-4">
                <div class="w-20 h-20 bg-black text-white border-4 border-black flex items-center justify-center text-5xl relative">
                    <span x-text="selectedAvatar"></span>
                    <div class="absolute -bottom-2 -right-2 bg-pink-500 text-[10px] px-2 py-1 font-black border-2 border-black" x-text="'LVL ' + playerLevel"></div>
                </div>
                <div>
                    <h2 class="text-2xl font-black truncate bungee" x-text="username"></h2>
                    <p class="text-[10px] font-bold text-pink-500" x-text="playerClass"></p>
                    <div class="xp-bar w-32 mt-2">
                        <div class="xp-progress" :style="'width:' + xpToNextLevel + '%'"></div>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-6 grid grid-cols-3 gap-4">
                <div class="bg-black text-white neo-border p-3 text-center">
                    <span class="text-[10px] font-black text-blue-400">TOTAL AURA</span>
                    <p class="text-4xl font-black bungee" x-text="aura"></p>
                </div>
                <div class="bg-white neo-border p-3 text-center">
                    <span class="text-[10px] font-black text-pink-500">BOOKS READ</span>
                    <p class="text-4xl font-black bungee" x-text="stats.booksFinished"></p>
                </div>
                <div class="bg-white neo-border p-3 text-center">
                    <span class="text-[10px] font-black text-green-600">STREAK</span>
                    <p class="text-4xl font-black bungee" x-text="stats.streak + 'd'"></p>
                </div>
            </div>

            <div class="lg:col-span-3 flex gap-4">
                <button @click="resetData()" class="bg-yellow-400 neo-border px-4 font-black text-[10px] neo-btn">WIPE DATA</button>
                <button @click="logout()" class="flex-grow bg-red-500 text-white neo-border font-black neo-btn">EXIT</button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <!-- SIDEBAR: QUESTS -->
            <div class="lg:col-span-3 space-y-6">
                <div class="bg-white neo-border p-4">
                    <h3 class="bungee text-sm mb-4 border-b-4 border-black pb-2">ACTIVE QUESTS</h3>
                    <div class="space-y-3">
                        <template x-for="q in quests">
                            <div class="p-2 border-2 border-black flex items-center gap-3" :class="q.done ? 'bg-gray-100 opacity-50' : 'bg-yellow-50'">
                                <div class="text-xl" x-text="q.icon"></div>
                                <div class="flex-grow">
                                    <p class="text-[9px] font-black" x-text="q.title"></p>
                                    <p class="text-[8px] text-pink-600" x-text="'+' + q.xp + ' XP'"></p>
                                </div>
                                <button x-show="!q.done" @click="completeQuest(q)" class="bg-black text-white text-[8px] p-1 neo-btn">CLAIM</button>
                            </div>
                        </template>
                    </div>
                </div>
            </div>

            <!-- MAIN CONTENT -->
            <div class="lg:col-span-6">
                <div class="bg-white neo-border min-h-[600px] flex flex-col">
                    <div class="flex border-b-4 border-black">
                        <button @click="activeTab = 'shelf'" :class="activeTab === 'shelf' ? 'tab-active' : ''" class="flex-1 p-4 font-black text-xs">📚 THE VAULT</button>
                        <button @click="activeTab = 'chat'" :class="activeTab === 'chat' ? 'tab-active' : ''" class="flex-1 p-4 font-black text-xs">💬 THE HUB</button>
                    </div>

                    <!-- SHELF -->
                    <div x-show="activeTab === 'shelf'" class="p-6">
                        <div class="bg-pink-100 border-4 border-black p-4 mb-6">
                            <h3 class="font-black text-sm mb-2">DONATE BOOK (LINK/PDF URL)</h3>
                            <div class="grid grid-cols-2 gap-3">
                                <input x-model="newBook.t" placeholder="TITLE" class="p-2 border-2 border-black font-bold text-xs">
                                <input x-model="newBook.a" placeholder="AUTHOR" class="p-2 border-2 border-black font-bold text-xs">
                                <input x-model="newBook.u" placeholder="LINK (URL to PDF/Ebook)" class="col-span-2 p-2 border-2 border-black font-bold text-xs">
                                <button @click="donateBook()" class="col-span-2 bg-black text-white p-3 text-xs neo-btn">UPLOAD TO ARCHIVE</button>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <template x-for="b in books">
                                <div class="bg-white border-4 border-black p-4 h-48 flex flex-col justify-between">
                                    <div>
                                        <h4 class="font-black text-xl italic glitch-text" x-text="b.t"></h4>
                                        <p class="text-[10px] font-bold text-gray-500" x-text="'BY: ' + b.a"></p>
                                    </div>
                                    <div class="flex gap-2">
                                        <button @click="borrow(b)" :disabled="b.taken" :class="b.taken ? 'bg-gray-200' : 'bg-[#bcff00]'" class="flex-grow p-3 text-[10px] neo-btn">
                                            <span x-text="b.taken ? 'HELD BY @' + b.taken : 'EQUIP BOOK'"></span>
                                        </button>
                                        <button x-show="b.u" @click="window.open(b.u, '_blank')" class="bg-white border-2 border-black px-5 text-xl neo-btn">📖</button>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function app() {
            return {
                isLoggedIn: false,
                username: '',
                selectedAvatar: '🕶️',
                playerClass: 'Lurker',
                playerLevel: 1,
                xp: 0,
                xpToNextLevel: 0,
                aura: 500,
                activeTab: 'shelf',
                stats: { booksFinished: 0, streak: 1 },
                newBook: { t: '', a: '', u: '' },
                
                // Default Books (Used only if storage is empty)
                books: [
                    {t: 'Metamorphosis', a: 'Kafka', u: 'https://www.gutenberg.org/files/5200/5200-h/5200-h.htm', taken: null},
                    {t: 'The Art of War', a: 'Sun Tzu', u: 'https://www.gutenberg.org/files/132/132-pdf.pdf', taken: null}
                ],
                
                quests: [
                    {id: 1, title: 'Inject a PDF into the Vault', xp: 200, icon: '💉', done: false},
                    {id: 2, title: 'Read a Classic', xp: 100, icon: '📜', done: false}
                ],

                avatars: [{img: '🦾', name: 'CYBORG'}, {img: '🍄', name: 'SHROOM'}, {img: '🧙', name: 'MAGE'}, {img: '🐱', name: 'NEKO'}],

                init() {
                    this.loadData();
                },

                // THE SAVE SYSTEM
                saveData() {
                    const data = {
                        books: this.books,
                        xp: this.xp,
                        aura: this.aura,
                        stats: this.stats,
                        quests: this.quests,
                        username: this.username,
                        selectedAvatar: this.selectedAvatar,
                        playerClass: this.playerClass
                    };
                    localStorage.setItem('NEO_LIBRARY_SAVE', JSON.stringify(data));
                },

                // THE LOAD SYSTEM
                loadData() {
                    const saved = localStorage.getItem('NEO_LIBRARY_SAVE');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        this.books = parsed.books || this.books;
                        this.xp = parsed.xp || 0;
                        this.aura = parsed.aura || 500;
                        this.stats = parsed.stats || { booksFinished: 0, streak: 1 };
                        this.quests = parsed.quests || this.quests;
                        this.username = parsed.username || '';
                        this.selectedAvatar = parsed.selectedAvatar || '🕶️';
                        this.playerClass = parsed.playerClass || 'Lurker';
                        this.updateLevel();
                    }
                },

                login() {
                    if(this.username) {
                        this.isLoggedIn = true;
                        this.saveData();
                    }
                },

                donateBook() {
                    if(!this.newBook.t || !this.newBook.u) return alert("Need Title and URL!");
                    this.books.unshift({...this.newBook, taken: null});
                    this.xp += 200;
                    this.aura += 100;
                    this.updateLevel();
                    this.newBook = {t: '', a: '', u: ''};
                    this.saveData(); // <--- Persists the new book
                },

                borrow(b) {
                    b.taken = this.username;
                    this.stats.booksFinished++;
                    this.xp += 50;
                    this.updateLevel();
                    this.saveData(); // <--- Persists the borrow status
                },

                completeQuest(q) {
                    q.done = true;
                    this.xp += q.xp;
                    this.updateLevel();
                    this.saveData();
                },

                updateLevel() {
                    this.playerLevel = Math.floor(this.xp / 100) + 1;
                    this.xpToNextLevel = (this.xp % 100);
                },

                resetData() {
                    if(confirm("Delete all books and progress?")) {
                        localStorage.removeItem('NEO_LIBRARY_SAVE');
                        location.reload();
                    }
                },

                logout() { this.isLoggedIn = false; }
            }
        }
    </script>
</body>
</html>
