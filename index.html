<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borrow a Book</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Mega:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        body { font-family: 'Lexend Mega', sans-serif; background-color: #FFDE59; }
        .neo-border { border: 4px solid black; }
        .neo-shadow { box-shadow: 8px 8px 0px 0px rgba(0,0,0,1); }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body x-data="app()">

    <!-- LOGIN BOX (Always visible first) -->
    <template x-if="!isLoggedIn">
        <div class="fixed inset-0 flex items-center justify-center bg-[#FFDE59] z-[100] p-4">
            <div class="bg-[#FF914D] neo-border p-8 max-w-md w-full neo-shadow">
                <h1 class="text-4xl font-black mb-6 uppercase italic">Borrow a Book</h1>
                <input type="text" x-model="username" placeholder="Username" class="w-full neo-border p-3 mb-6 focus:outline-none text-xl font-bold">
                <button @click="login()" class="w-full bg-[#8C52FF] text-white neo-border p-4 text-2xl font-black uppercase">Enter Site →</button>
                <p class="text-center mt-4 text-xs font-bold">If this screen stays here, check the console (F12)</p>
            </div>
        </div>
    </template>

    <!-- DASHBOARD (Hidden until login) -->
    <div x-show="isLoggedIn" x-cloak class="p-4 md:p-8 max-w-6xl mx-auto">
        <header class="flex justify-between items-center bg-[#5CE1E6] neo-border p-6 mb-8 neo-shadow">
            <h2 class="text-xl font-black uppercase" x-text="'Hi, ' + username"></h2>
            <button @click="isLoggedIn = false" class="bg-red-400 neo-border px-4 py-2 font-bold">LOGOUT</button>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- CHAT -->
            <div class="bg-[#7ED957] neo-border p-6 neo-shadow h-[400px] flex flex-col">
                <h3 class="font-black mb-4 uppercase">Chat</h3>
                <div class="flex-grow overflow-y-auto neo-border bg-white p-4 mb-4 space-y-2">
                    <template x-for="m in messages">
                        <div class="text-xs bg-gray-100 p-2 neo-border">
                            <b x-text="m.username"></b>: <span x-text="m.content"></span>
                        </div>
                    </template>
                </div>
                <div class="flex gap-2">
                    <input @keyup.enter="postMessage()" x-model="chatInput" class="flex-grow neo-border p-2 text-xs">
                    <button @click="postMessage()" class="bg-black text-white px-4 neo-border font-black">SEND</button>
                </div>
            </div>

            <!-- SHELF -->
            <div class="bg-white neo-border p-6 neo-shadow">
                <h3 class="font-black mb-4 uppercase">Bookshelf</h3>
                <div class="space-y-4">
                    <template x-for="book in books">
                        <div class="p-4 neo-border bg-yellow-50 flex justify-between items-center">
                            <div>
                                <h4 class="font-black" x-text="book.title"></h4>
                                <p class="text-[10px]" x-text="book.author"></p>
                            </div>
                            <button @click="if(book.pdf_url) window.open(book.pdf_url)" class="bg-cyan-400 neo-border p-2 text-[10px] font-black">READ</button>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </div>

    <script>
        function app() {
            return {
                isLoggedIn: false,
                username: '',
                messages: [],
                books: [],
                chatInput: '',
                sb: null,

                login() {
                    if(!this.username) return alert("Enter name");
                    
                    // Connect only when login is clicked
                    const URL = 'https://xeefrgjdopybjfofsnts.supabase.co';
                    const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhlZWZyZ2pkb3B5Ympmb2ZzbnRzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzMzEyNjgsImV4cCI6MjA5NjkwNzI2OH0.9mpDByrFmBOn9MXJkRxb55QbK-A-tBAoMDg9chVbpGk';
                    
                    try {
                        this.sb = window.supabase.createClient(URL, KEY);
                        this.isLoggedIn = true;
                        this.fetch();
                    } catch(e) {
                        alert("Database error! check F12 console");
                    }
                },

                async fetch() {
                    const { data: b } = await this.sb.from('books').select('*');
                    this.books = b || [];
                    const { data: m } = await this.sb.from('messages').select('*');
                    this.messages = m || [];
                },

                async postMessage() {
                    await this.sb.from('messages').insert([{ username: this.username, content: this.chatInput }]);
                    this.chatInput = '';
                    this.fetch();
                }
            }
        }
    </script>
</body>
</html>
