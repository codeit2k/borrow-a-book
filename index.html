<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEO-LIBRARY v4.0 // AURA + HYPE</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Syncopate:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        :root { --bg: #00f0ff; --primary: #ff007f; --accent: #bcff00; }
        body { font-family: 'Space Grotesk', sans-serif; background-color: var(--bg); color: #000; overflow-x: hidden; }
        .neo-brutal { border: 4px solid black; box-shadow: 8px 8px 0px 0px #000; transition: all 0.1s; }
        .neo-brutal:hover { transform: translate(-2px, -2px); box-shadow: 12px 12px 0px 0px #000; }
        .aura-badge { font-family: 'Syncopate', sans-serif; }
        
        @keyframes float { 0% { transform: rotate(0deg) translateY(0px); } 50% { transform: rotate(3deg) translateY(-10px); } 100% { transform: rotate(0deg) translateY(0px); } }
        .floating { animation: float 4s ease-in-out infinite; }
        
        .trending-row:nth-child(even) { background-color: #f3f3f3; }
        .custom-scroll::-webkit-scrollbar { width: 8px; }
        .custom-scroll::-webkit-scrollbar-track { background: #000; }
        .custom-scroll::-webkit-scrollbar-thumb { background: var(--primary); border: 1px solid #000; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body x-data="app()" x-init="init()">

    <!-- OVERLAY: VIBE CHECK -->
    <div x-show="!isLoggedIn" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-md p-4">
        <div class="bg-white neo-brutal p-8 max-w-md w-full text-center relative overflow-hidden">
            <div class="absolute -left-10 -bottom-10 text-9xl opacity-10 floating">📚</div>
            <h1 class="text-4xl font-black uppercase mb-4 italic tracking-tighter">Enter the Archive</h1>
            <p class="mb-6 font-bold text-sm uppercase">Current Global Hype: <span class="text-pink-600">UNSTABLE</span></p>
            
            <input type="text" x-model="username" placeholder="NAME/HANDLE" class="w-full border-4 border-black p-4 mb-4 text-center font-bold text-xl focus:bg-yellow-50 outline-none">
            
            <div class="grid grid-cols-4 gap-2 mb-6">
                <template x-for="av in avatars">
                    <button @click="selectedAvatar = av" :class="selectedAvatar === av ? 'bg-pink-500 text-white' : 'bg-white'" class="text-2xl p-2 border-2 border-black hover:bg-black hover:text-white transition-colors" x-text="av"></button>
                </template>
            </div>
            
            <button @click="login()" class="w-full bg-[#bcff00] p-5 text-2xl font-black border-4 border-black shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] active:shadow-none active:translate-x-1 active:translate-y-1 transition-all">LOAD PROFILE →</button>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div x-show="isLoggedIn" x-cloak class="p-4 md:p-8 max-w-[1600px] mx-auto">
        
        <!-- TOP NAV / STATS -->
        <header class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10 items-center">
            <div class="bg-white neo-brutal p-4 flex items-center gap-4">
                <div class="w-16 h-16 bg-pink-500 border-4 border-black flex items-center justify-center text-4xl" x-text="selectedAvatar"></div>
                <div>
                    <h2 class="font-bold text-xl" x-text="'@'+username"></h2>
                    <p class="text-[10px] font-black uppercase bg-black text-white px-2 inline-block">Member Level: Rookie</p>
                </div>
            </div>

            <div class="bg-[#ff007f] neo-brutal p-4 text-white text-center relative overflow-hidden">
                <div class="relative z-10">
                    <p class="text-xs font-black uppercase tracking-widest opacity-80">Your Aura Points</p>
                    <p class="text-5xl font-black aura-badge" x-text="aura"></p>
                    <p class="text-[10px] mt-1 font-bold" :class="auraChange > 0 ? 'text-green-300' : 'text-yellow-300'" x-text="auraStatusMsg"></p>
                </div>
                <div class="absolute right-0 top-0 text-6xl opacity-20 -rotate-12">✨</div>
            </div>

            <div class="bg-white neo-brutal p-4 flex justify-between items-center">
                <div>
                    <p class="text-xs font-black uppercase">Library Health</p>
                    <div class="w-32 h-4 border-2 border-black bg-gray-200 mt-1">
                        <div class="h-full bg-green-400" :style="'width:' + (books.length * 5) + '%'"></div>
                    </div>
                </div>
                <button @click="logout()" class="bg-black text-white p-2 font-bold text-xs uppercase hover:bg-red-500 transition-colors">Exit_Sys</button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- LEFT: BOT ARCHIVE -->
            <div class="lg:col-span-3 space-y-8">
                <div class="bg-white neo-brutal flex flex-col h-[650px] overflow-hidden">
                    <div class="bg-black text-white p-4 flex items-center gap-3">
                        <div class="w-10 h-10 bg-blue-500 border-2 border-white rounded-full flex items-center justify-center text-xl floating">🤖</div>
                        <div>
                            <p class="font-bold text-sm">LIB-GEN_Z</p>
                            <p class="text-[8px] uppercase tracking-tighter text-green-400 animate-pulse">Online & Judging</p>
                        </div>
                    </div>

                    <div id="chatbox" class="flex-grow overflow-y-auto custom-scroll p-4 space-y-4 bg-gray-50">
                        <template x-for="m in messages">
                            <div class="flex flex-col" :class="m.username === 'Librarian Bot' ? 'items-start' : 'items-end'">
                                <div :class="m.username === 'Librarian Bot' ? 'bg-black text-white' : 'bg-white border-2 border-black text-black'" 
                                     class="p-3 text-xs font-bold shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] max-w-[90%]">
                                    <span x-text="m.content"></span>
                                </div>
                            </div>
                        </template>
                    </div>

                    <div class="p-4 border-t-4 border-black bg-[#bcff00]">
                        <div class="flex gap-2">
                            <input @keyup.enter="postMessage()" x-model="chatInput" placeholder="Ask for a 'hot take'..." class="flex-grow p-2 border-2 border-black text-xs font-bold focus:outline-none">
                            <button @click="postMessage()" class="bg-black text-white px-4 border-2 border-black font-bold text-xs">GO</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- CENTER: THE MAIN SHELF -->
            <div class="lg:col-span-6 space-y-8">
                <div class="bg-white neo-brutal p-6">
                    <div class="flex justify-between items-end mb-6">
                        <h3 class="text-4xl font-black uppercase italic tracking-tighter">The Live Feed</h3>
                        <button @click="showAdd = !showAdd" class="bg-black text-white px-4 py-2 font-bold text-sm neo-brutal" x-text="showAdd ? 'CLOSE X' : '+ ADD BOOK'"></button>
                    </div>

                    <div x-show="showAdd" x-transition class="mb-8 p-4 bg-yellow-100 border-4 border-black border-dashed">
                        <div class="grid grid-cols-2 gap-4">
                            <input x-model="newBook.title" placeholder="TITLE" class="p-2 border-2 border-black font-bold">
                            <input x-model="newBook.author" placeholder="AUTHOR" class="p-2 border-2 border-black font-bold">
                            <input x-model="newBook.pdfUrl" placeholder="PDF URL" class="col-span-2 p-2 border-2 border-black text-xs">
                            <button @click="addBook()" class="col-span-2 bg-pink-500 text-white p-3 font-black uppercase border-2 border-black">Drop the Book</button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <template x-for="book in books">
                            <div class="bg-white border-4 border-black p-4 flex flex-col justify-between hover:scale-[1.02] transition-transform shadow-[4px_4px_0px_0px_#000]" 
                                 :class="book.borrowed_by ? 'opacity-50 grayscale' : ''">
                                <div>
                                    <h4 class="font-black text-lg uppercase leading-tight" x-text="book.title"></h4>
                                    <p class="text-[10px] font-bold text-gray-400 mt-1" x-text="'Author: ' + book.author"></p>
                                </div>
                                <div class="mt-6 flex gap-2">
                                    <button @click="borrowBook(book)" x-show="!book.borrowed_by" class="flex-grow bg-[#bcff00] border-2 border-black p-2 font-bold text-[10px] uppercase">Borrow</button>
                                    <button @click="returnBook(book)" x-show="book.borrowed_by === username" class="flex-grow bg-blue-400 border-2 border-black p-2 font-bold text-[10px] uppercase">Return</button>
                                    <button x-show="book.pdf_url" @click="window.open(book.pdf_url, '_blank')" class="bg-white border-2 border-black p-2 text-[10px]">📖</button>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>

            <!-- RIGHT: TRENDING & GENRES -->
            <div class="lg:col-span-3 space-y-8">
                <div class="bg-black text-white neo-brutal p-6">
                    <h3 class="text-2xl font-black uppercase italic mb-4 text-[#bcff00]">Trending Now</h3>
                    <div class="space-y-4">
                        <template x-for="(trend, index) in trending">
                            <div class="flex items-center gap-3 border-b border-gray-700 pb-2">
                                <span class="text-2xl font-black text-pink-500" x-text="'#' + (index + 1)"></span>
                                <div>
                                    <p class="text-xs font-bold uppercase truncate w-40" x-text="trend.title"></p>
                                    <p class="text-[8px] text-gray-400 uppercase" x-text="trend.genre"></p>
                                </div>
                                <div class="ml-auto bg-[#bcff00] text-black text-[8px] px-1 font-bold">HOT</div>
                            </div>
                        </template>
                    </div>
                </div>

                <div class="bg-white neo-brutal p-4">
                    <h3 class="font-black uppercase mb-3 text-sm">Bot's Hot Takes (Reviews)</h3>
                    <div class="bg-gray-100 p-3 border-2 border-black text-[11px] font-bold italic">
                        "If you read <span class="text-pink-600" x-text="hotTake.book"></span>, you're literally <span x-text="hotTake.review"></span>."
                    </div>
                    <button @click="generateHotTake()" class="mt-2 w-full bg-black text-white p-1 text-[10px] font-bold">GET ANOTHER TAKE</button>
                </div>
                
                <div class="relative">
                    <img src="https://img.freepik.com/free-vector/hand-drawn-sticker-style-libra-sign_23-2149204068.jpg" class="w-32 absolute -top-10 -right-5 rotate-12 opacity-50 grayscale hover:grayscale-0 transition-all">
                </div>
            </div>
        </div>
    </div>

    <script>
        function app() {
            return {
                isLoggedIn: false,
                username: '',
                selectedAvatar: '🕶️',
                avatars: ['🕶️', '💅', '🔥', '💀', '🧊', '🤡', '👽', '👾'],
                aura: 1000,
                auraChange: 0,
                auraStatusMsg: 'VIBING',
                newBook: { title: '', author: '', pdfUrl: '' },
                books: [],
                messages: [],
                chatInput: '',
                showAdd: false,
                hotTake: { book: 'everything', review: 'mid' },
                trending: [
                    { title: "Metamorphosis", genre: "SAD" },
                    { title: "The Art of War", genre: "SIGMA" },
                    { title: "1984", genre: "DYSTOPIAN" },
                    { title: "No Longer Human", genre: "FEELS" },
                    { title: "Basic HTML", genre: "NERD" }
                ],
                sb: null,

                async init() {
                    const SB_URL = 'https://xeefrgjdopybjfofsnts.supabase.co';
                    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhlZWZyZ2pkb3B5Ympmb2ZzbnRzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzMzEyNjgsImV4cCI6MjA5NjkwNzI2OH0.9mpDByrFmBOn9MXJkRxb55QbK-A-tBAoMDg9chVbpGk';
                    
                    const check = setInterval(() => {
                        if (window.supabase) {
                            clearInterval(check);
                            this.sb = window.supabase.createClient(SB_URL, SB_KEY);
                            this.fetchData();
                            setInterval(() => this.fetchData(), 4000);
                            // Aura Decay Logic (Lose 1 point every 30 seconds for inactivity)
                            setInterval(() => this.updateAura(-1, 'INACTIVITY DRAIN'), 30000);
                        }
                    }, 500);
                    this.generateHotTake();
                },

                async fetchData() {
                    if (!this.sb) return;
                    const { data: b } = await this.sb.from('books').select('*').order('created_at', { ascending: false });
                    if (b) this.books = b;
                    const { data: m } = await this.sb.from('messages').select('*').order('created_at', { ascending: true }).limit(50);
                    if (m) this.messages = m;
                    
                    let c = document.getElementById('chatbox');
                    if(c) c.scrollTop = c.scrollHeight;
                },

                login() {
                    if (this.username.trim()) {
                        this.isLoggedIn = true;
                        this.triggerBot(`Logged in: @${this.username}. Aura check complete. Warning: Ur current taste is under investigation.`);
                    }
                },

                logout() { this.isLoggedIn = false; },

                updateAura(val, reason) {
                    this.aura += val;
                    this.auraChange = val;
                    this.auraStatusMsg = reason;
                    setTimeout(() => { this.auraChange = 0; this.auraStatusMsg = 'STABLE'; }, 3000);
                },

                async addBook() {
                    if (!this.newBook.title) return;
                    await this.sb.from('books').insert([{ title: this.newBook.title, author: this.newBook.author, pdf_url: this.newBook.pdfUrl }]);
                    this.updateAura(50, 'CONTRIBUTOR BONUS');
                    this.triggerBot(`U actually added "${this.newBook.title}"? Major aura points gained, but ur taste is still questionable.`);
                    this.newBook = { title: '', author: '', pdfUrl: '' };
                    this.showAdd = false;
                    this.fetchData();
                },

                async borrowBook(book) {
                    await this.sb.from('books').update({ borrowed_by: this.username }).eq('id', book.id);
                    this.updateAura(20, 'READING BUFF');
                    this.fetchData();
                    this.triggerBot(`Claimed "${book.title}". Don't just let it sit in ur digital drawer, actually read it. fr.`);
                },

                async returnBook(book) {
                    await this.sb.from('books').update({ borrowed_by: null }).eq('id', book.id);
                    this.updateAura(30, 'HONESTY BUFF');
                    this.fetchData();
                    this.triggerBot(`Return processed. Aura +30. See? Being a good person isn't that hard.`);
                },

                generateHotTake() {
                    const books = ['Kafka', 'Colleen Hoover', 'Shakespeare', 'Manga', 'Coding Docs', 'Philosophy'];
                    const takes = ['main character energy', 'totally delulu', 'valid fr fr', 'a huge red flag', 'peaking in high school', 'actually high aura'];
                    this.hotTake = {
                        book: books[Math.floor(Math.random() * books.length)],
                        review: takes[Math.floor(Math.random() * takes.length)]
                    };
                },

                async postMessage() {
                    if (!this.chatInput.trim()) return;
                    const input = this.chatInput.toLowerCase();
                    await this.sb.from('messages').insert([{ username: this.username, avatar: this.selectedAvatar, content: this.chatInput }]);
                    this.chatInput = '';
                    this.fetchData();

                    setTimeout(() => {
                        if (input.includes('hot take') || input.includes('review')) {
                            this.generateHotTake();
                            this.triggerBot(`Hot Take: People who read ${this.hotTake.book} are ${this.hotTake.review}. No cap.`);
                        } else if (input.includes('aura')) {
                            this.triggerBot(`Ur aura is ${this.aura}. ${this.aura > 1000 ? 'Slay.' : 'Ur falling off, read more.'}`);
                        } else if (input.includes('recommend') || input.includes('genre')) {
                            this.triggerBot("Genre Check: If u want AURA, read Strategy. If u want to CRY, read Romance. If u want to be SMART, read Sci-Fi. Choose wisely.");
                        } else {
                            const sassy = ["That message was mid. Try again.", "Purr. Anyway, read a book.", "I'm a bot and even I have better aura than that sentence.", "Moving on..."];
                            this.triggerBot(sassy[Math.floor(Math.random() * sassy.length)]);
                        }
                    }, 800);
                },

                async triggerBot(text) {
                    await this.sb.from('messages').insert([{ username: 'Librarian Bot', avatar: '🤖', content: text }]);
                    this.fetchData();
                }
            }
        }
    </script>
</body>
</html>
