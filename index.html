<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEO-LIBRARY // v5.0 ULTIMATE</title>
    
    <!-- External CSS (Tailwind) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    
    <!-- Alpine.js (Logic Engine) -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        body { 
            font-family: 'Space Grotesk', sans-serif; 
            background-color: #f0f0f0; 
            color: #000; 
        }
        .neo-border { border: 4px solid black; box-shadow: 10px 10px 0px 0px #000; }
        .neo-button { border: 3px solid black; box-shadow: 5px 5px 0px 0px #000; cursor: pointer; transition: 0.1s; }
        .neo-button:active { transform: translate(3px, 3px); box-shadow: 0px 0px 0px 0px #000; }
        
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
        .bot-avatar { animation: float 3s ease-in-out infinite; }
        
        .custom-scroll::-webkit-scrollbar { width: 8px; }
        .custom-scroll::-webkit-scrollbar-track { background: #000; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #ff007f; border: 1px solid #000; }
    </style>
</head>
<body x-data="app()">

    <!-- LOGIN SCREEN -->
    <div x-show="!isLoggedIn" class="fixed inset-0 z-[100] flex items-center justify-center bg-[#ff007f] p-4">
        <div class="bg-white neo-border p-8 max-w-md w-full text-center">
            <h1 class="text-6xl font-black italic mb-4">VIBE CHECK</h1>
            <input type="text" x-model="username" placeholder="USERNAME" class="w-full border-4 border-black p-4 mb-4 text-center font-bold text-xl outline-none">
            
            <div class="grid grid-cols-4 gap-2 mb-8">
                <template x-for="av in ['🕶️', '💅', '🔥', '💀', '🤡', '👽', '👾', '🍄']">
                    <button @click="selectedAvatar = av" :class="selectedAvatar === av ? 'bg-black text-white' : 'bg-white'" class="text-2xl p-2 border-2 border-black" x-text="av"></button>
                </template>
            </div>
            
            <button @click="login()" class="w-full bg-[#bcff00] p-6 text-3xl font-black border-4 border-black neo-button">GET IN →</button>
        </div>
    </div>

    <!-- MAIN APP -->
    <div x-show="isLoggedIn" class="p-4 md:p-10 max-w-[1500px] mx-auto">
        
        <!-- HEADER STATS -->
        <header class="grid grid-cols-1 md:grid-cols-12 gap-6 mb-12">
            <div class="md:col-span-4 bg-white neo-border p-6 flex items-center gap-4">
                <div class="w-16 h-16 bg-[#00f0ff] border-4 border-black flex items-center justify-center text-4xl" x-text="selectedAvatar"></div>
                <div>
                    <h2 class="text-2xl font-bold" x-text="'@'+username"></h2>
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-green-500 border-2 border-black animate-pulse"></span>
                        <span class="text-[10px] font-bold uppercase">System Online</span>
                    </div>
                </div>
            </div>

            <div class="md:col-span-4 bg-[#bcff00] neo-border p-6 text-center">
                <p class="text-xs font-black uppercase opacity-60">Your Aura Points</p>
                <p class="text-5xl font-black" x-text="aura"></p>
                <p class="text-[10px] font-bold uppercase mt-1" x-text="auraStatus"></p>
            </div>

            <div class="md:col-span-4 bg-white neo-border p-6 flex items-center justify-center">
                <button @click="logout()" class="w-full bg-black text-white p-3 font-bold neo-button uppercase text-sm">Log Out</button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
            
            <!-- CHAT BOT -->
            <div class="lg:col-span-3">
                <div class="bg-white neo-border h-[600px] flex flex-col overflow-hidden">
                    <div class="bg-black text-white p-4 flex items-center gap-3">
                        <div class="text-3xl bot-avatar">🤖</div>
                        <p class="font-bold text-sm">LIB-GEN_Z</p>
                    </div>
                    <div id="chatbox" class="flex-grow p-4 space-y-4 overflow-y-auto bg-gray-50 custom-scroll">
                        <template x-for="m in messages">
                            <div class="flex flex-col" :class="m.user === 'Bot' ? 'items-start' : 'items-end'">
                                <div :class="m.user === 'Bot' ? 'bg-black text-white' : 'bg-[#00f0ff] border-2 border-black'" class="p-3 text-xs font-bold shadow-[4px_4px_0px_0px_#000] max-w-[85%]">
                                    <span x-text="m.text"></span>
                                </div>
                            </div>
                        </template>
                    </div>
                    <div class="p-4 bg-white border-t-4 border-black flex gap-2">
                        <input x-model="chatInput" @keyup.enter="sendMessage()" placeholder="Type..." class="flex-grow p-2 border-2 border-black font-bold outline-none">
                        <button @click="sendMessage()" class="bg-[#ff007f] text-white px-4 font-bold neo-button">GO</button>
                    </div>
                </div>
            </div>

            <!-- SHELF & PDFS -->
            <div class="lg:col-span-6 space-y-8">
                <div class="bg-[#00f0ff] neo-border p-6">
                    <h3 class="text-2xl font-black uppercase mb-4">Free PDF Vault</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <template x-for="pdf in pdfs">
                            <div class="bg-white border-2 border-black p-3 flex justify-between items-center">
                                <span class="font-bold text-xs uppercase" x-text="pdf.t"></span>
                                <a :href="pdf.u" target="_blank" class="bg-[#bcff00] px-2 py-1 text-[10px] font-black neo-button">OPEN</a>
                            </div>
                        </template>
                    </div>
                </div>

                <div class="bg-white neo-border p-6">
                    <h3 class="text-3xl font-black uppercase mb-6 italic tracking-tighter">Community Shelf</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <template x-for="b in books">
                            <div class="border-4 border-black p-4 flex flex-col justify-between h-44 shadow-[4px_4px_0px_0px_#000]">
                                <h4 class="font-black text-lg uppercase leading-tight" x-text="b.title"></h4>
                                <button @click="borrow(b)" :disabled="b.taken" :class="b.taken ? 'bg-gray-200' : 'bg-[#bcff00]'" class="w-full border-2 border-black p-2 font-black text-[10px] uppercase">
                                    <span x-text="b.taken ? 'Taken by ' + b.taken : 'Borrow'"></span>
                                </button>
                            </div>
                        </template>
                    </div>
                </div>
            </div>

            <!-- TRENDING TODAY -->
            <div class="lg:col-span-3 space-y-8">
                <div class="bg-black text-white neo-border p-6">
                    <h3 class="text-xl font-black uppercase mb-6 text-[#bcff00]">Trending Top 10</h3>
                    <div class="space-y-4">
                        <template x-for="(t, i) in trending">
                            <div class="flex items-center gap-3">
                                <span class="text-xl font-black text-[#ff007f]" x-text="i+1"></span>
                                <span class="text-[10px] font-bold uppercase truncate" x-text="t"></span>
                            </div>
                        </template>
                    </div>
                </div>

                <div class="bg-white neo-border p-6">
                    <h3 class="text-xs font-black uppercase mb-2">Bot's Hot Take</h3>
                    <p class="text-xs italic font-bold border-l-4 border-pink-500 pl-2" x-text="hotTake"></p>
                </div>
            </div>

        </div>
    </div>

    <script>
        function app() {
            return {
                isLoggedIn: false,
                username: '',
                selectedAvatar: '🕶️',
                aura: 1000,
                auraStatus: 'VIBING',
                chatInput: '',
                hotTake: "If you read for the 'aesthetic' but don't finish the book, your aura is zero. No cap.",
                messages: [{user: 'Bot', text: 'Vibe check. Say something or get roasted.'}],
                books: [
                    {title: 'No Longer Human', taken: null},
                    {title: 'Meditations', taken: null},
                    {title: 'Atomic Habits', taken: null},
                    {title: 'Crime & Punishment', taken: null}
                ],
                trending: [
                    "Atomic Habits - Clear",
                    "It Ends With Us - Hoover",
                    "The Housemaid - McFadden",
                    "Iron Flame - Yarros",
                    "1984 - Orwell",
                    "Yellowface - Kuang",
                    "Dune - Herbert",
                    "The Silent Patient",
                    "Funny Story - Henry",
                    "Verity - Hoover"
                ],
                pdfs: [
                    {t: 'Gatsby', u: 'https://www.ibiblio.org/ebooks/Fitzgerald/Gatsby/Gatsby.pdf'},
                    {t: '1984', u: 'https://rauterberg.employee.id.tue.nl/lecturenotes/DDM110/Orwell-1984.pdf'},
                    {t: 'Kafka', u: 'https://www.gutenberg.org/files/5200/5200-h/5200-h.htm'}
                ],

                login() {
                    if(this.username) {
                        this.isLoggedIn = true;
                        // Start Aura Decay
                        setInterval(() => { this.aura -= 1; this.auraStatus = 'Aura Draining (Idle)'; }, 10000);
                    }
                },
                logout() { this.isLoggedIn = false; },
                borrow(b) {
                    b.taken = this.username;
                    this.aura += 50;
                    this.auraStatus = 'Aura Gain: +50!';
                    this.messages.push({user: 'Bot', text: `You took ${b.title}. Hope ur reading level is higher than ur aura.`});
                },
                sendMessage() {
                    if(!this.chatInput) return;
                    this.messages.push({user: 'You', text: this.chatInput});
                    const input = this.chatInput.toLowerCase();
                    this.chatInput = '';
                    this.aura += 5;
                    
                    setTimeout(() => {
                        if(input.includes('rec')) {
                            this.messages.push({user: 'Bot', text: 'If ur feeling delulu, read Romance. If ur a villain, read Strategy.'});
                        } else if(input.includes('hi') || input.includes('hello')) {
                            this.messages.push({user: 'Bot', text: 'Slay. Welcome to the archive. Keep it down.'});
                        } else {
                            this.messages.push({user: 'Bot', text: 'That message was mid. Anyway, read a book.'});
                        }
                        const c = document.getElementById('chatbox');
                        c.scrollTop = c.scrollHeight;
                    }, 600);
                }
            }
        }
    </script>
</body>
</html>
