<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEO-LIBRARY // v7.0 THE NEXUS</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Syncopate:wght@700&family=Bungee&display=swap" rel="stylesheet">
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        :root { --neon-pink: #ff007f; --neon-green: #bcff00; --neon-blue: #00f0ff; }
        body { font-family: 'Space Grotesk', sans-serif; background-color: var(--neon-green); color: #000; overflow-x: hidden; }
        .bungee { font-family: 'Bungee', cursive; }
        
        .neo-border { border: 4px solid black; box-shadow: 10px 10px 0px 0px #000; transition: 0.2s; }
        .neo-border:hover { transform: translate(-2px, -2px); box-shadow: 14px 14px 0px 0px #000; }
        
        .neo-btn { border: 3px solid black; box-shadow: 4px 4px 0px 0px #000; cursor: pointer; transition: 0.1s; font-weight: 800; text-transform: uppercase; }
        .neo-btn:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px 0px #000; }
        
        .glass { background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px); border: 4px solid black; }
        .tab-active { background-color: var(--neon-pink) !important; color: white !important; transform: translateY(-5px); }
        
        @keyframes scanline { 0% { bottom: 100%; } 100% { bottom: 0%; } }
        .scanline { position: absolute; width: 100%; height: 2px; background: rgba(0,0,0,0.1); animation: scanline 6s linear infinite; pointer-events: none; }
        
        .xp-bar { height: 20px; border: 3px solid black; background: #fff; position: relative; overflow: hidden; }
        .xp-progress { height: 100%; background: var(--neon-blue); transition: width 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        .glitch-text:hover { animation: glitch 0.3s infinite; }
        @keyframes glitch {
            0% { text-shadow: 2px 0 var(--neon-pink), -2px 0 var(--neon-blue); }
            50% { text-shadow: -2px 0 var(--neon-pink), 2px 0 var(--neon-blue); }
            100% { text-shadow: 2px 0 var(--neon-pink), -2px 0 var(--neon-blue); }
        }
    </style>
</head>
<body x-data="app()" x-init="init()">
    <div class="scanline"></div>

    <!-- LOGIN OVERLAY (LEVEL 0) -->
    <div x-show="!isLoggedIn" class="fixed inset-0 z-[100] flex items-center justify-center bg-black p-4">
        <div class="bg-white neo-border p-8 max-w-md w-full text-center relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-2 bg-pink-500 animate-pulse"></div>
            <h1 class="text-6xl font-black italic mb-2 bungee tracking-tighter">THE NEXUS</h1>
            <p class="text-xs font-bold uppercase mb-6 tracking-[0.3em] text-pink-600">Syncing Reading Consciousness...</p>
            
            <input type="text" x-model="username" placeholder="PLAYER_ID" class="w-full border-4 border-black p-4 mb-4 text-center font-bold text-2xl outline-none focus:ring-4 ring-pink-400">
            
            <p class="text-[10px] font-black mb-2 text-left">CHOOSE YOUR AVATAR CLASS:</p>
            <div class="grid grid-cols-4 gap-3 mb-8">
                <template x-for="av in avatars">
                    <button @click="selectedAvatar = av.img; playerClass = av.name" 
                            :class="selectedAvatar === av.img ? 'bg-pink-500 scale-110 text-white' : 'bg-gray-100'" 
                            class="text-3xl p-3 border-4 border-black transition-all hover:-rotate-12">
                        <span x-text="av.img"></span>
                        <p class="text-[8px] mt-1 text-black font-black" x-text="av.name"></p>
                    </button>
                </template>
            </div>
            <button @click="login()" class="w-full bg-[#bcff00] p-6 text-3xl font-black border-4 border-black neo-btn bungee">INITIALIZE</button>
        </div>
    </div>

    <!-- MAIN INTERFACE -->
    <div x-show="isLoggedIn" class="p-4 md:p-6 max-w-[1700px] mx-auto">
        
        <!-- TOP HUD -->
        <header class="grid grid-cols-1 lg:grid-cols-12 gap-4 mb-8">
            <!-- PLAYER CARD -->
            <div class="lg:col-span-3 bg-white neo-border p-4 flex items-center gap-4 relative overflow-hidden">
                <div class="w-20 h-20 bg-black text-white border-4 border-black flex items-center justify-center text-5xl relative">
                    <span x-text="selectedAvatar"></span>
                    <div class="absolute -bottom-2 -right-2 bg-pink-500 text-[10px] px-2 py-1 font-black border-2 border-black" x-text="'LVL ' + playerLevel"></div>
                </div>
                <div class="flex-grow">
                    <h2 class="text-2xl font-black truncate bungee" x-text="username"></h2>
                    <p class="text-[10px] font-bold text-pink-500 uppercase" x-text="playerClass"></p>
                    <div class="xp-bar mt-2">
                        <div class="xp-progress" :style="'width:' + xpToNextLevel + '%'"></div>
                    </div>
                </div>
            </div>

            <!-- GLOBAL STATS (GAME STYLE) -->
            <div class="lg:col-span-6 grid grid-cols-3 gap-4">
                <div class="bg-black text-white neo-border p-3 flex flex-col items-center justify-center">
                    <span class="text-[10px] font-black text-blue-400">TOTAL AURA</span>
                    <span class="text-4xl font-black bungee tracking-widest" x-text="aura"></span>
                </div>
                <div class="bg-white neo-border p-3 flex flex-col items-center justify-center">
                    <span class="text-[10px] font-black text-pink-500">BOOKS READ</span>
                    <span class="text-4xl font-black bungee" x-text="stats.booksFinished"></span>
                </div>
                <div class="bg-white neo-border p-3 flex flex-col items-center justify-center">
                    <span class="text-[10px] font-black text-green-600">STREAK</span>
                    <span class="text-4xl font-black bungee" x-text="stats.streak + 'd'"></span>
                </div>
            </div>

            <!-- UTILITY -->
            <div class="lg:col-span-3 flex gap-4">
                <div class="flex-grow bg-white neo-border p-4 flex flex-col justify-center text-center">
                    <p class="text-[10px] font-black uppercase">Server Stability</p>
                    <div class="flex justify-center gap-1 mt-2">
                        <template x-for="i in 5">
                            <div class="w-4 h-6 border-2 border-black" :class="i <= 4 ? 'bg-green-400' : 'bg-gray-200'"></div>
                        </template>
                    </div>
                </div>
                <button @click="logout()" class="bg-red-500 text-white neo-border px-6 font-black text-xs neo-btn">ABORT</button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- LEFT COLUMN: THE BOT & QUESTS -->
            <div class="lg:col-span-3 space-y-6">
                <!-- AI BOT PANEL -->
                <div class="bg-white neo-border h-[450px] flex flex-col overflow-hidden relative">
                    <div class="bg-black text-white p-3 flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <span class="text-2xl animate-bounce">🤖</span>
                            <span class="font-black text-xs tracking-tighter">LIB-GEN_Z v7.0</span>
                        </div>
                        <span class="text-[8px] bg-green-500 text-black px-2 py-1 font-black">STRIKE: ACTIVE</span>
                    </div>
                    <div id="chatbox" class="flex-grow p-4 space-y-4 overflow-y-auto bg-slate-50 text-[11px] font-bold">
                        <template x-for="m in messages">
                            <div :class="m.user === 'Bot' ? 'text-left' : 'text-right'">
                                <div :class="m.user === 'Bot' ? 'bg-black text-white' : 'bg-blue-400 border-2 border-black'" class="inline-block p-2 max-w-[85%] neo-border">
                                    <span x-text="m.text"></span>
                                </div>
                            </div>
                        </template>
                    </div>
                    <div class="p-3 bg-white border-t-4 border-black flex gap-2">
                        <input x-model="chatInput" @keyup.enter="sendMessage()" placeholder="Roast a book..." class="flex-grow p-2 border-2 border-black font-black text-[10px] outline-none">
                        <button @click="sendMessage()" class="bg-pink-500 text-white px-4 neo-btn text-xs">SEND</button>
                    </div>
                </div>

                <!-- QUEST LOG (NEW FEATURE) -->
                <div class="bg-white neo-border p-4">
                    <h3 class="bungee text-sm mb-4 border-b-4 border-black pb-2">ACTIVE QUESTS</h3>
                    <div class="space-y-3">
                        <template x-for="q in quests">
                            <div class="p-2 border-2 border-black flex items-center gap-3 relative overflow-hidden group" :class="q.done ? 'bg-gray-100 opacity-50' : 'bg-yellow-50'">
                                <div class="text-xl" x-text="q.icon"></div>
                                <div class="flex-grow">
                                    <p class="text-[9px] font-black leading-tight" x-text="q.title"></p>
                                    <p class="text-[8px] text-pink-600" x-text="'+' + q.xp + ' XP'"></p>
                                </div>
                                <button x-show="!q.done" @click="completeQuest(q)" class="bg-black text-white text-[8px] p-1 neo-btn">CLAIM</button>
                            </div>
                        </template>
                    </div>
                </div>
            </div>

            <!-- CENTER COLUMN: CORE GAMEPLAY -->
            <div class="lg:col-span-6">
                <div class="bg-white neo-border min-h-[700px] flex flex-col">
                    <div class="flex border-b-4 border-black">
                        <button @click="activeTab = 'shelf'" :class="activeTab === 'shelf' ? 'tab-active' : ''" class="flex-1 p-4 font-black uppercase text-xs">📚 The Vault</button>
                        <button @click="activeTab = 'vibe'" :class="activeTab === 'vibe' ? 'tab-active' : ''" class="flex-1 p-4 font-black uppercase text-xs">🔮 Vibe Matcher</button>
                        <button @click="activeTab = 'chat'" :class="activeTab === 'chat' ? 'tab-active' : ''" class="flex-1 p-4 font-black uppercase text-xs">💬 The Hub</button>
                    </div>

                    <!-- VAULT TAB -->
                    <div x-show="activeTab === 'shelf'" class="p-6">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="bungee text-xl">Available Loot</h2>
                            <button @click="showDonate = !showDonate" class="bg-blue-400 p-2 neo-btn text-[10px]">DONATE BOOK (+XP)</button>
                        </div>

                        <!-- DONATE FORM -->
                        <div x-show="showDonate" class="bg-pink-100 border-4 border-black p-4 mb-6 animate-bounce-short">
                            <div class="grid grid-cols-2 gap-3">
                                <input x-model="newBook.t" placeholder="BOOK TITLE" class="p-2 border-2 border-black font-bold text-xs">
                                <input x-model="newBook.a" placeholder="AUTHOR NAME" class="p-2 border-2 border-black font-bold text-xs">
                                <input x-model="newBook.u" placeholder="PDF/SOURCE URL" class="col-span-2 p-2 border-2 border-black font-bold text-xs">
                                <button @click="donateBook()" class="col-span-2 bg-black text-white p-3 text-xs neo-btn">INJECT INTO SYSTEM</button>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <template x-for="b in books">
                                <div class="group relative bg-white border-4 border-black p-4 h-52 flex flex-col justify-between hover:bg-slate-50 transition-colors">
                                    <div class="absolute -top-3 -right-3 bg-white border-2 border-black px-2 py-1 text-[8px] font-black group-hover:bg-yellow-400" x-text="b.genre"></div>
                                    <div>
                                        <h4 class="font-black text-xl italic uppercase leading-none mb-1 glitch-text" x-text="b.t"></h4>
                                        <p class="text-[9px] font-bold text-gray-500" x-text="'ARCHIVE_BY: ' + b.a"></p>
                                    </div>
                                    <div class="flex gap-2">
                                        <button @click="borrow(b)" :disabled="b.taken" :class="b.taken ? 'bg-gray-200' : 'bg-[#bcff00]'" class="flex-grow p-3 text-[10px] neo-btn">
                                            <span x-text="b.taken ? 'LOCKED BY @' + b.taken : 'EQUIP BOOK'"></span>
                                        </button>
                                        <button x-show="b.u" @click="window.open(b.u, '_blank')" class="bg-white border-2 border-black px-5 text-xl neo-btn">📖</button>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- VIBE MATCHER TAB (NEW INTERACTIVE PANEL) -->
                    <div x-show="activeTab === 'vibe'" class="p-8 text-center flex flex-col items-center justify-center h-full min-h-[600px]">
                        <div class="bg-black text-white p-8 neo-border w-full max-w-sm">
                            <p class="text-xs mb-4 bungee text-blue-400">WHAT'S THE ENERGY TODAY?</p>
                            <div class="grid grid-cols-2 gap-4">
                                <button @click="matchVibe('existential')" class="p-4 border-2 border-white hover:bg-white hover:text-black font-black text-[10px]">EXISTENTIAL DREAD</button>
                                <button @click="matchVibe('delusional')" class="p-4 border-2 border-white hover:bg-white hover:text-black font-black text-[10px]">DELUSIONAL ROMANCE</button>
                                <button @click="matchVibe('villain')" class="p-4 border-2 border-white hover:bg-white hover:text-black font-black text-[10px]">VILLAIN ARC</button>
                                <button @click="matchVibe('brainrot')" class="p-4 border-2 border-white hover:bg-white hover:text-black font-black text-[10px]">PURE BRAINROT</button>
                            </div>
                            
                            <div x-show="matchResult" class="mt-8 p-4 border-2 border-pink-500 animate-pulse">
                                <p class="text-[10px] text-pink-500 mb-1 font-black">MATCH FOUND:</p>
                                <p class="text-xl font-black bungee" x-text="matchResult"></p>
                            </div>
                        </div>
                    </div>

                    <!-- HUB TAB -->
                    <div x-show="activeTab === 'chat'" class="p-6 flex flex-col h-[600px]">
                        <div class="flex-grow space-y-4 overflow-y-auto mb-4 pr-2">
                            <template x-for="p in communityPosts">
                                <div class="bg-white border-2 border-black p-3 shadow-[6px_6px_0px_0px_#000]">
                                    <div class="flex justify-between items-center mb-2 border-b-2 border-black pb-1">
                                        <span class="text-[10px] font-black uppercase text-pink-600" x-text="'>> ' + p.user"></span>
                                        <span class="text-[8px] font-bold opacity-50" x-text="p.time"></span>
                                    </div>
                                    <p class="text-xs font-bold italic" x-text="p.text"></p>
                                </div>
                            </template>
                        </div>
                        <div class="flex gap-2">
                            <input x-model="postInput" @keyup.enter="postToCommunity()" placeholder="Broadcast message..." class="flex-grow border-4 border-black p-4 text-xs font-black outline-none">
                            <button @click="postToCommunity()" class="bg-black text-white px-8 neo-btn bungee text-xs">POST</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- RIGHT COLUMN: LEADERBOARD & SKILLS -->
            <div class="lg:col-span-3 space-y-6">
                <!-- SKILL TREE -->
                <div class="bg-black text-white neo-border p-6">
                    <h3 class="bungee text-sm mb-6 text-blue-400">SKILL TREE</h3>
                    <div class="space-y-6">
                        <div>
                            <div class="flex justify-between text-[10px] font-black mb-1">
                                <span>INTELLECT</span>
                                <span x-text="skills.intellect + '/100'"></span>
                            </div>
                            <div class="w-full h-2 bg-gray-800 border border-white">
                                <div class="h-full bg-blue-500" :style="'width:' + skills.intellect + '%'"></div>
                            </div>
                        </div>
                        <div>
                            <div class="flex justify-between text-[10px] font-black mb-1">
                                <span>VIBE CHEX</span>
                                <span x-text="skills.vibe + '/100'"></span>
                            </div>
                            <div class="w-full h-2 bg-gray-800 border border-white">
                                <div class="h-full bg-pink-500" :style="'width:' + skills.vibe + '%'"></div>
                            </div>
                        </div>
                        <div>
                            <div class="flex justify-between text-[10px] font-black mb-1">
                                <span>CHAOS</span>
                                <span x-text="skills.chaos + '/100'"></span>
                            </div>
                            <div class="w-full h-2 bg-gray-800 border border-white">
                                <div class="h-full bg-yellow-400" :style="'width:' + skills.chaos + '%'"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- TOP READERS -->
                <div class="bg-white neo-border p-6">
                    <h3 class="text-xl font-black uppercase bungee mb-6 italic underline decoration-pink-500">THE ELITE</h3>
                    <div class="space-y-4">
                        <template x-for="(player, i) in leaderboard">
                            <div class="flex items-center justify-between border-b-2 border-black pb-2">
                                <div class="flex items-center gap-3">
                                    <span class="text-lg font-black" x-text="i+1"></span>
                                    <span class="text-xs font-bold" x-text="player.name"></span>
                                </div>
                                <span class="text-[10px] bg-black text-white px-2 py-1 font-black" x-text="player.aura + ' AURA'"></span>
                            </div>
                        </template>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        function app() {
            return {
                isLoggedIn: false,
                username: '',
                selectedAvatar: '🕶️',
                playerClass: 'Lurker',
                playerLevel: 1,
                xp: 0,
                xpToNextLevel: 20,
                aura: 500,
                activeTab: 'shelf',
                showDonate: false,
                matchResult: '',
                
                stats: { booksFinished: 0, streak: 1 },
                skills: { intellect: 20, vibe: 40, chaos: 10 },
                
                avatars: [
                    {img: '🦾', name: 'CYBORG'}, {img: '🍄', name: 'SHROOM'}, 
                    {img: '🧙', name: 'MAGE'}, {img: '🧛', name: 'VAMP'},
                    {img: '🐱', name: 'NEKO'}, {img: '🛸', name: 'ALIEN'},
                    {img: '👺', name: 'ONI'}, {img: '🏴‍☠️', name: 'PIRATE'}
                ],

                quests: [
                    {id: 1, title: 'Read a Kafka work (Depression Buff)', xp: 100, icon: '🪳', done: false},
                    {id: 2, title: 'Roast a bad book in Global Hub', xp: 50, icon: '🔥', done: false},
                    {id: 3, title: 'Inject a PDF into the Vault', xp: 200, icon: '💉', done: false}
                ],

                messages: [{user: 'Bot', text: 'SYSTEM REBOOTED. Archive v7.0 is online. Don\'t be mid.'}],
                
                communityPosts: [
                    {user: 'ADMIN', text: 'New update: XP now matters. Start reading or stay a level 1 noob.', time: '09:00 AM'},
                    {user: 'X_Readz_X', text: 'Anyone want to trade reading logs? My aura is peaking.', time: '10:45 AM'}
                ],

                books: [
                    {t: 'Metamorphosis', a: 'Kafka', genre: 'Existential Dread', u: '#', taken: null},
                    {t: 'The Art of War', a: 'Sun Tzu', genre: 'Tactical Chaos', u: '#', taken: null},
                    {t: 'No Longer Human', a: 'Osamu Dazai', genre: 'Melancholy', u: '#', taken: null},
                    {t: 'Neuromancer', a: 'William Gibson', genre: 'Cyberpunk', u: '#', taken: null}
                ],

                leaderboard: [
                    {name: 'BookDragon', aura: 9999},
                    {name: 'KafkaLover69', aura: 8400},
                    {name: 'PageTurner', aura: 5200}
                ],

                newBook: {t: '', a: '', u: ''},

                init() {
                    console.log("NEO-LIB INITIALIZED");
                },

                login() {
                    if(this.username) {
                        this.isLoggedIn = true;
                        this.addXP(10);
                    }
                },

                addXP(amount) {
                    this.xp += amount;
                    this.xpToNextLevel = (this.xp % 100);
                    this.playerLevel = Math.floor(this.xp / 100) + 1;
                    this.aura += amount * 2;
                },

                completeQuest(quest) {
                    quest.done = true;
                    this.addXP(quest.xp);
                    this.triggerBot(`Quest Complete: ${quest.title}. +${quest.xp} XP gained. Ur slightly less mid now.`);
                },

                matchVibe(vibe) {
                    const matches = {
                        existential: "Notes from Underground",
                        delusional: "The Great Gatsby",
                        villain: "American Psycho",
                        brainrot: "The 48 Laws of Power"
                    };
                    this.matchResult = matches[vibe];
                    this.addXP(5);
                    this.skills.vibe += 2;
                },

                donateBook() {
                    if(!this.newBook.t) return;
                    this.books.unshift({...this.newBook, genre: 'Community Drop', taken: null});
                    this.addXP(200);
                    this.skills.intellect += 10;
                    this.showDonate = false;
                    this.newBook = {t: '', a: '', u: ''};
                    this.triggerBot("Book Injected. System IQ increased by 0.0001%.");
                },

                borrow(b) {
                    b.taken = this.username;
                    this.addXP(50);
                    this.stats.booksFinished++;
                    this.skills.intellect += 5;
                    this.triggerBot(`@${this.username} equipped ${b.t}. Buff active.`);
                },

                postToCommunity() {
                    if(!this.postInput) return;
                    this.communityPosts.unshift({
                        user: this.username,
                        text: this.postInput,
                        time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
                    });
                    this.addXP(20);
                    this.skills.chaos += 5;
                    this.postInput = '';
                },

                sendMessage() {
                    if(!this.chatInput) return;
                    this.messages.push({user: this.username, text: this.chatInput});
                    const inp = this.chatInput.toLowerCase();
                    this.chatInput = '';
                    
                    setTimeout(() => {
                        if(inp.includes('roast')) this.triggerBot("Reading is for people who find reality too poorly written. Slay.");
                        else if(inp.includes('lvl')) this.triggerBot(`Ur Level ${this.playerLevel}. Those are rookie numbers.`);
                        else this.triggerBot("Cool story. Go read a book.");
                    }, 600);
                },

                triggerBot(text) {
                    this.messages.push({user: 'Bot', text: text});
                    this.$nextTick(() => {
                        const c = document.getElementById('chatbox');
                        if(c) c.scrollTop = c.scrollHeight;
                    });
                },

                logout() { location.reload(); }
            }
        }
    </script>
</body>
</html>
