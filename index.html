<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEO-LIBRARY // v9.0 OMNI-NEXUS</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Syncopate:wght@700&family=Bungee&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        :root { --neon-pink: #ff007f; --neon-green: #bcff00; --neon-blue: #00f0ff; --neon-yellow: #fff200; }
        body { font-family: 'Space Grotesk', sans-serif; background-color: var(--neon-green); color: #000; overflow-x: hidden; }
        .bungee { font-family: 'Bungee', cursive; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Neo-Brutalist Core Styles */
        .neo-border { border: 4px solid black; box-shadow: 10px 10px 0px 0px #000; transition: 0.2s; }
        .neo-btn { border: 3px solid black; box-shadow: 4px 4px 0px 0px #000; cursor: pointer; transition: 0.1s; font-weight: 800; text-transform: uppercase; }
        .neo-btn:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px 0px #000; }
        .tab-active { background-color: var(--neon-pink) !important; color: white !important; transform: translateY(-5px); box-shadow: 0px 8px 0px 0px black; }
        
        /* Animations */
        @keyframes float { 0% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-10px) rotate(2deg); } 100% { transform: translateY(0px) rotate(0deg); } }
        .bot-avatar { animation: float 4s ease-in-out infinite; }
        
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        .marquee { white-space: nowrap; animation: marquee 20s linear infinite; }

        .xp-bar { height: 16px; border: 3px solid black; background: #fff; position: relative; overflow: hidden; }
        .xp-progress { height: 100%; background: var(--neon-blue); transition: width 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        .custom-scroll::-webkit-scrollbar { width: 10px; }
        .custom-scroll::-webkit-scrollbar-track { background: #000; }
        .custom-scroll::-webkit-scrollbar-thumb { background: var(--neon-pink); border: 2px solid #000; }

        .glitch-text:hover { animation: glitch 0.3s infinite; }
        @keyframes glitch {
            0% { text-shadow: 2px 0 var(--neon-pink), -2px 0 var(--neon-blue); }
            50% { text-shadow: -2px 0 var(--neon-pink), 2px 0 var(--neon-blue); }
            100% { text-shadow: 2px 0 var(--neon-pink), -2px 0 var(--neon-blue); }
        }
    </style>
</head>
<body x-data="app()" x-init="init()">

    <!-- LOGIN OVERLAY -->
    <div x-show="!isLoggedIn" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/95 p-4">
        <div class="bg-white neo-border p-8 max-w-md w-full text-center relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-2 bg-pink-500 animate-pulse"></div>
            <h1 class="text-5xl font-black mb-2 bungee italic tracking-tighter">OMNI-NEXUS</h1>
            <p class="text-[10px] font-bold uppercase mb-6 tracking-widest text-pink-600 mono">Version 9.0 // Community Identity Required</p>
            
            <input type="text" x-model="username" placeholder="HANDLE" class="w-full border-4 border-black p-4 mb-4 text-center font-bold text-2xl outline-none focus:ring-4 ring-pink-400">
